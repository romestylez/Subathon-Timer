<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Subathon Control</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #222;
      color: #eee;
      text-align: center;
      padding: 20px;
    }
    h1 { color: #ffcc00; }
    button {
      margin: 10px;
      padding: 12px 24px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
      background: #444;
      color: #fff;
      transition: background 0.2s;
    }
    button:hover { background: #666; }
    .time-btn { background: #0066cc; }
    .pause { background: #cc3300; }
    .resume { background: #339933; }
    .toggle { background: #9966cc; }
    #status { margin-top: 20px; font-size: 20px; }
    #timer {
      margin-top: 20px;
      font-size: 40px;
      font-weight: bold;
      color: #00ccff;
    }
    pre#logbox {
      text-align: left;
      background: #111;
      color: #0f0;
      padding: 10px;
      max-height: 400px;
      overflow-y: auto;
      border: 1px solid #333;
    }
    #goals {
      margin-top: 30px;
      background: #111;
      border: 1px solid #333;
      padding: 10px 20px;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
      text-align: left;
      font-size: 14px;
    }
    #goals h2 {
      text-align: center;
      color: #ffcc00;
      font-size: 18px;
      margin-top: 0;
    }
    .goal-item {
      margin: 5px 0;
      color: #ffcc00;
    }
    .goal-item.reached {
      color: #6aff6a;
    }
    .goal-inputs {
      display: flex;
      gap: 5px;
      margin: 5px 0;
    }
    .goal-inputs input {
      width: 60px;
      padding: 3px;
      text-align: center;
    }
    .goal-inputs input[type="text"] {
      flex: 1;
      text-align: left;
    }
    #saveGoals {
      background: #339933;
      width: auto;
      padding: 8px 16px;
      display: inline-block;
      font-size: 15px;
    }
    #resetSupport {
      background: #cc3300;
      width: auto;
      padding: 8px 16px;
      display: inline-block;
      font-size: 15px;
      margin-left: 10px;
    }
    .button-row {
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>Subathon Control</h1>

  <div id="timer">00:00:00</div>
  <div id="status">Status: -</div>

  <div>
    <button class="pause" onclick="send('/pause')">Pause</button>
    <button class="resume" onclick="send('/resume')">Resume</button>
  </div>

  <div>
    <button class="time-btn" onclick="send('/time?delta=5')">+5 Min</button>
    <button class="time-btn" onclick="send('/time?delta=10')">+10 Min</button>
    <button class="time-btn" onclick="send('/time?minusdelta=5')">-5 Min</button>
    <button class="time-btn" onclick="send('/time?minusdelta=10')">-10 Min</button>
  </div>
  <h2>🎉 Happy Hour</h2>
<div>
  <button onclick="startHappyHour()">▶️ Start Happy Hour</button>
  <button onclick="stopHappyHour()">⛔ Stop Happy Hour</button>
</div>

<div id="happyStatus" style="margin-top:10px; font-size:20px; color:#ffcc00;">
  Happy Hour: nicht aktiv
</div>


  <h2>Recent Events</h2>
  <pre id="logbox">(Waiting for events...)</pre>

  <div id="goals">
    <h2>Goals</h2>
    <div id="total">Gesamt Support: -</div>
    <div id="goal-list"></div>
    <hr>
    <h3 style="text-align:center;color:#ffcc00;">Goals bearbeiten</h3>
    <form id="goalForm">
      <div id="goalInputs"></div>
      <div class="button-row">
        <button type="button" id="saveGoals">💾 Ziele speichern</button>
        <button type="button" id="resetSupport">🗑️ Reset Support</button>
      </div>
    </form>
  </div>

  <script>
    const BASE = "http://localhost:5000";
    let editingGoals = false;
    let editTimeout;

    document.getElementById("goalForm").addEventListener("input", () => {
      editingGoals = true;
      clearTimeout(editTimeout);
      editTimeout = setTimeout(() => editingGoals = false, 5000); // 5 Sek. nach letztem Tipp wieder freigeben
    });

    function formatTime(sec) {
      let h = Math.floor(sec / 3600);
      let m = Math.floor((sec % 3600) / 60);
      let s = sec % 60;
      return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
    }

    function updateState(data) {
      document.getElementById("timer").innerText = formatTime(data.remaining);
      document.getElementById("status").innerText = `Status: ${data.paused ? "Paused" : "Running"}`;
    }

    function send(path) {
      fetch(BASE + path)
        .then(r => r.json())
        .then(updateState)
        .catch(err => {
          document.getElementById("status").innerText = "Error: " + err;
        });
    }

    function loadLog() {
      fetch(BASE + "/time_log")
        .then(r => r.json())
        .then(data => {
          const box = document.getElementById("logbox");
          box.textContent = data.lines.join("");
          box.scrollTop = box.scrollHeight;
        });
    }

    function loadGoals() {
      if (editingGoals) return; // ⛔ kein Reload während Eingabe
      fetch(BASE + "/goals")
        .then(r => r.json())
        .then(data => {
          const total = data.total_minutes_supported;
          const goalList = document.getElementById("goal-list");
          const goalInputs = document.getElementById("goalInputs");
          function formatHoursMinutes(totalMinutes) {
  // auf ganze Minuten runden (verhindert 52.90000000006 usw.)
  const total = Math.round(totalMinutes);
  let hours = Math.floor(total / 60);
  let minutes = total - hours * 60;
  // Sicherheitsnetz falls durch Rundung 60 Minuten entstehen
  if (minutes === 60) { hours += 1; minutes = 0; }
  return { hours, minutes };
}

const { hours, minutes } = formatHoursMinutes(total);
document.getElementById("total").innerText =
  `Gesamt Support: ${hours} Stunden ${minutes} Minuten`;


          goalList.innerHTML = "";
          goalInputs.innerHTML = "";
          data.goals.forEach((g, i) => {
            const reached = !!g.reached;
            const emoji = reached ? "✅" : "⏳";
            const div = document.createElement("div");
            div.className = "goal-item" + (reached ? " reached" : "");
            div.textContent = `${emoji} ${g.hours} Stunden - ${g.title}`;
            goalList.appendChild(div);

            const row = document.createElement("div");
            row.className = "goal-inputs";
            row.innerHTML = `
              <input type="number" id="hours${i}" value="${g.hours}" min="0">
              <input type="text" id="title${i}" value="${g.title}">
            `;
            goalInputs.appendChild(row);
          });

          for (let i = data.goals.length; i < 5; i++) {
            const row = document.createElement("div");
            row.className = "goal-inputs";
            row.innerHTML = `
              <input type="number" id="hours${i}" placeholder="Stunden" min="0">
              <input type="text" id="title${i}" placeholder="Titel">
            `;
            goalInputs.appendChild(row);
          }
        })
        .catch(err => console.error("Error loading goals:", err));
    }

    document.getElementById("saveGoals").addEventListener("click", () => {
      editingGoals = false;
      const newGoals = [];
      for (let i = 0; i < 5; i++) {
        const hours = parseInt(document.getElementById(`hours${i}`)?.value || 0);
        const title = document.getElementById(`title${i}`)?.value.trim();
        if (hours > 0 && title) newGoals.push({ hours, title });
      }

      fetch(BASE + "/goals/update", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ goals: newGoals })
      })
      .then(r => r.json())
      .then(() => {
        alert("Ziele gespeichert!");
        loadGoals();
      })
      .catch(err => alert("Fehler beim Speichern: " + err));
    });

    document.getElementById("resetSupport").addEventListener("click", () => {
      editingGoals = false;
      if (!confirm("⚠️ Bist du sicher, dass du den gesamten Support-Zähler zurücksetzen willst?")) return;
      fetch(BASE + "/goals/reset")
        .then(r => r.json())
        .then(() => {
          alert("Gesamt-Support wurde zurückgesetzt!");
          loadGoals();
        })
        .catch(err => alert("Fehler beim Reset: " + err));
    });

    // Auto-Updates
    setInterval(() => {
      fetch(BASE + "/state").then(r => r.json()).then(updateState);
    }, 1000);
    setInterval(loadLog, 5000);
    setInterval(loadGoals, 10000);

    loadLog();
    loadGoals();
	
	function startHappyHour() {
    const minutes = prompt("Happy Hour Dauer (Minuten):", "60");
    if (!minutes) return;
    fetch(BASE + "/happyhour?start&time=" + minutes)
        .then(r => r.json())
        .then(d => alert("Happy Hour gestartet! x" + d.multiplier))
        .catch(err => alert("Fehler: " + err));
}

	function stopHappyHour() {
    fetch(BASE + "/happyhour?stop")
        .then(r => r.json())
        .then(() => alert("Happy Hour gestoppt."))
        .catch(err => alert("Fehler: " + err));
}

let happyRemaining = 0;
let happyActive = false;
let happyMultiplier = 1;

// Minuten+Sekunden Format
function formatHH(sec) {
  let m = Math.floor(sec / 60);
  let s = sec % 60;
  return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}

// /happyhour Polling
function updateHappyHour() {
  fetch(BASE + "/happyhour")
    .then(r => r.json())
    .then(d => {
      happyActive = d.active;
      happyRemaining = d.remaining_seconds;
      happyMultiplier = d.multiplier;

      const box = document.getElementById("happyStatus");

      if (!d.active) {
        box.innerText = "Happy Hour: nicht aktiv";
        box.style.color = "#ffcc00";
      } else {
        box.innerText =
          `Happy Hour aktiv! x${happyMultiplier}\n` +
          `Restzeit: ${formatHH(happyRemaining)}`;
        box.style.color = "#00ff66";
      }
    })
    .catch(err => console.error("HappyHour error:", err));
}

// 1-Sekunden-Countdown
setInterval(() => {
  if (happyActive && happyRemaining > 0) {
    happyRemaining--;
    const box = document.getElementById("happyStatus");
    box.innerText =
      `Happy Hour aktiv! x${happyMultiplier}\n` +
      `Restzeit: ${formatHH(happyRemaining)}`;
  }
}, 1000);

// API-Polling alle 5 sec
setInterval(updateHappyHour, 5000);

// direkt laden
updateHappyHour();

  </script>
</body>
</html>
