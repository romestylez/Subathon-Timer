<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Subathon Goals</title>
  <style>
    body {
      margin: 0;
      background: rgba(0, 0, 0, 0);
      color: #ffcc00;
      font-family: Arial, sans-serif;
      font-size: 16px;
      line-height: 1.4em;
      overflow: hidden;
    }
    #goalsBox {
      padding: 10px 15px;
      text-align: left;
    }
    .headline {
      color: #ffcc00;
      font-weight: bold;
      margin-bottom: 5px;
      font-size: 17px;
      display: inline-block;
    }
    .divider {
      border-top: 1px solid #005fa3; /* Blau */
      margin: 4px 0 6px 0;
      display: block;
      width: auto;
    }
    .goal-line {
      margin: 2px 0;
      color: #ffcc00;
      display: inline-block;
    }
    .goal-line.reached {
      color: #6aff6a;
    }
  </style>
</head>
<body>
  <div id="goalsBox">Lade Ziele...</div>

  <script>
    const BASE = "http://localhost:5000";

    function loadGoals() {
      fetch(BASE + "/goals")
        .then(r => r.json())
        .then(data => {
          const box = document.getElementById("goalsBox");

          const totalMinutes = Number(data.total_minutes_supported || 0);
          const goals = Array.isArray(data.goals) ? data.goals : [];

          // ✅ RUNDUNG eingebaut
          let hours = Math.floor(totalMinutes / 60);
          let minutes = Math.round(totalMinutes % 60);

          // ✅ Falls Minuten durch Rundung genau 60 → Stunde +1
          if (minutes === 60) {
            hours += 1;
            minutes = 0;
          }

          let html = `<div class="headline">Gesamt Support: ${hours} Stunden ${minutes} Minuten</div>
                      <div class="divider"></div>`;

          goals.forEach((g) => {
            const reached = !!g.reached;
            const emoji = reached ? "✅" : "⏳";
            html += `
              <div class="goal-line ${reached ? 'reached' : ''}">
                ${emoji} ${Number(g.hours || 0)} Stunden – ${g.title || ""}
              </div><br>
            `;
          });

          if (goals.length === 0) {
            html += `<div class="goal-line">(Noch keine Ziele hinterlegt)</div>`;
          }

          box.innerHTML = html;

          // Textbreite dynamisch messen
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          ctx.font = "16px Arial";

          let maxWidth = ctx.measureText(`Gesamt Support: ${hours} Stunden ${minutes} Minuten`).width;
          goals.forEach((g) => {
            const text = `${Number(g.hours || 0)} Stunden – ${g.title || ""}`;
            const w = ctx.measureText(text).width;
            if (w > maxWidth) maxWidth = w;
          });

          const divider = box.querySelector('.divider');
          divider.style.width = Math.ceil(maxWidth) + 30 + 'px';
        })
        .catch(() => {
          document.getElementById("goalsBox").innerHTML = "";
        });
    }

    loadGoals();
    setInterval(loadGoals, 10000);
  </script>
</body>
</html>
