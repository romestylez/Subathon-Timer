<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Time Add – Scroll</title>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<style>
body {
    margin: 0;
    overflow: hidden;
    background: transparent;
    font-family: Arial, sans-serif;
}

.scrolling-words-container {
    position: absolute;
    top: 10px;
    left: 10px;
    display: none;
    align-items: center;
    font-size: 20px;
    font-weight: 600;
}

.scrolling-words-box {
    height: 48px;
    overflow: hidden;
}

#scroll-list {
    margin: 0;
    padding: 0;
    transform: translateY(0);
    transition: transform 0.6s ease-out;
}

#scroll-list li {
    list-style: none;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    color: #ffcc00;
    white-space: nowrap;
    text-shadow: 0 0 3px #000;
}
</style>
</head>
<body>

<div class="scrolling-words-container" id="scroll-container">
  <div class="scrolling-words-box">
    <ul id="scroll-list"></ul>
  </div>
</div>

<script>
const socket = io("http://subathon.smtxlost.tv:5000");

const container = document.getElementById("scroll-container");
const ul        = document.getElementById("scroll-list");

const SHOW_MS       = 4000;
const SCROLL_MS     = 600;
const IDLE_HIDE_MS  = 8000;
const ITEM_HEIGHT   = 48;

let scrollIndex  = 0;
let lastNewAt    = 0;
let scrollTimer  = null;

/* -----------------------------------------------------
   Fake-Dummy-Zeile => sorgt dafür, dass der erste echte 
   Event IMMER smooth rein-scrollt
------------------------------------------------------ */
addItem(" ");  // Dummy, wird sofort rausgescrollt


socket.on("time_added", data => {
    console.log("time_added:", data);
    const text = formatEvent(data);
    addItem(text);
});

/* ================================
   FORMAT EVENT
================================ */
function formatEvent(data) {
    let label    = data.label || "";
    const minutes  = data.minutes || 0;
    const username = data.username || data.user || "Someone";
    const count    = data.count || 1;

    const timeStr = `${minutes} min`;

    // Happy Hour?
    const isHH = label.includes("HAPPY HOUR");
    const flame = isHH ? "🔥 " : "";

    // 🔥 Prefix entfernen, damit die Erkennung wieder funktioniert
    label = label.replace(/\[HAPPY HOUR.*?\]\s*/i, "");

    // Gift Bundle
    if (count > 1) {
        return `${flame}+${count} Subs von ${username} (${timeStr})`;
    }

    // Einzel Sub
    if (/sub/i.test(label)) {
        return `${flame}+1 Sub von ${username} (${timeStr})`;
    }

    // Bits
    if (/Bits/i.test(label)) {
        const m = label.match(/\((\d+)\)/) || label.match(/(\d+)\s*Bits/);
        const amt = m ? m[1] : "?";
        return `${flame}+${amt} Bits von ${username} (${timeStr})`;
    }

    // Donation / Tip
    if (/Donation|Tip|€/i.test(label)) {
        const m = label.match(/(\d+(\.\d+)?)/);
        const amt = m ? m[1] : "?";
        return `${flame}+${amt} € von ${username} (${timeStr})`;
    }

    // Kick Gifts
    if (/Kicks/i.test(label)) {
        const m = label.match(/\((\d+)\)/);
        const amt = m ? m[1] : "?";
        return `${flame}+${amt} Kicks von ${username} (${timeStr})`;
    }

    // Fallback
    return `${flame}+Support von ${username} (${timeStr})`;
}


/* ================================
   Item hinzufügen
================================ */
function addItem(text) {
    const li = document.createElement("li");
    li.textContent = text;
    ul.appendChild(li);

    container.style.display = "flex";
    lastNewAt = Date.now();

    if (!scrollTimer) {
        startScrollLoop();
    }
}

/* ================================
   Scroll-Loop
================================ */
function startScrollLoop() {
    scrollTimer = setInterval(() => {
        const count = ul.children.length;
        if (count === 0) {
            resetAll();
            return;
        }

        const idle = Date.now() - lastNewAt;

        if (count === 1) {
            if (idle > IDLE_HIDE_MS) resetAll();
            return;
        }

        if (scrollIndex < count - 1) {
    scrollIndex++;
} else {

    // Letzter Eintrag → raus scrollen
    scrollIndex++;

    ul.style.transition = `transform ${SCROLL_MS}ms ease-out`;
    ul.style.transform  = `translateY(-${scrollIndex * ITEM_HEIGHT}px)`;

    // danach Reset
    setTimeout(() => resetAll(), SCROLL_MS + 50);

    return;
}


        ul.style.transition = `transform ${SCROLL_MS}ms ease-out`;
        ul.style.transform  = `translateY(-${scrollIndex * ITEM_HEIGHT}px)`;

    }, SHOW_MS);
}

/* ================================
   Reset
================================ */
function resetAll() {
    if (scrollTimer) {
        clearInterval(scrollTimer);
        scrollTimer = null;
    }

    scrollIndex = 0;
    lastNewAt = 0;

    ul.style.transition = "none";
    ul.style.transform  = "translateY(0)";

    ul.innerHTML = "";
    container.style.display = "none";

    // Beim Reset wieder Dummy einfügen
    addItem(" ");
}
</script>

</body>
</html>
