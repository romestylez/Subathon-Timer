<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Saleng Donation Goal</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: Arial, sans-serif;
    color: white;
}

.wrapper {
    width: 420px;
}

.title {
    font-size: 18px;
    margin-bottom: 6px;
}

.bar-bg {
    width: 100%;
    height: 32px;
    background: rgba(255,255,255,0.25);
    border-radius: 16px;
    overflow: hidden;
    position: relative;
}

.bar {
    height: 100%;
    width: 0%;
    background: #00ff99;
    transition: width 0.4s ease;
}

.bar-text {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: bold;
    color: #ffffff;                 /* ← WEISS */
    text-shadow: 0 0 4px rgba(0,0,0,0.8);  /* bessere Lesbarkeit */
    pointer-events: none;
}
</style>
</head>

<body>

<div class="wrapper">
    <div class="title">Saleng Goal:</div>

    <div class="bar-bg">
        <div class="bar" id="bar"></div>
        <div class="bar-text" id="barText">0.00€ / 0€ (0.0%)</div>
    </div>
</div>

<script>
async function updateGoal() {
    try {
        const res = await fetch("http://subathon.smtxlost.tv:5000/donation_goal");
        const d = await res.json();

        if (!d.enabled) return;

        const percent = Math.min(100, (d.current / d.target) * 100);

        document.getElementById("bar").style.width = percent + "%";
        document.getElementById("barText").innerText =
            `${d.current.toFixed(2)}€ / ${d.target}€ (${percent.toFixed(1)}%)`;
    } catch (e) {
        console.error(e);
    }
}

setInterval(updateGoal, 2000);
updateGoal();
</script>

</body>
</html>
